[package]
authors = ["jD91mZM2 <me@krake.one>"]
description = "A Nix parser written in Rust"
edition = "2021"
license = "MIT"
name = "rnix"
readme = "README.md"
repository = "https://github.com/nix-community/rnix-parser"
version = "0.12.0"

# The nix-inspector tool turns nix inside out.
# It parses a Nix file and displays its internal structure.
[[bin]]
name = "nix-inspector"
path = "src/bin/nix-inspector.rs"

[[bench]]
harness = false
name = "all-packages"

[dependencies]
rowan = "0.15.0"

[dev-dependencies]
criterion = "0.3.0"
expect-test = "1.4.0"
